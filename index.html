<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aroha | Wellness</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="welcome">

        <!-- BRAND -->

        <div class="brand">

            <span class="brand-mark">✦</span>

            <h1>AROHA</h1>

            <p>Care for yourself. Live better.</p>

        </div>


        <!-- USER SELECTION -->

        <section class="selection">

            <h2>Who are you?</h2>

            <p class="subtitle">
                Choose your personalized wellness space
            </p>


            <div class="choice-container">

                <!-- WOMEN -->

                <div class="choice-card women">

                    <div class="icon">
                        ♀
                    </div>

                    <h3>Women</h3>

                    <p>
                        A wellness space designed for women
                    </p>

                    <button onclick="goToWomen()">
                        Continue
                    </button>

                </div>


                <!-- MEN -->

                <div class="choice-card men">

                    <div class="icon">
                        ♂
                    </div>

                    <h3>Men</h3>

                    <p>
                        A wellness space designed for men
                    </p>

                    <button onclick="goToMen()">
                        Continue
                    </button>

                </div>

            </div>

        </section>


        <!-- FOOTER -->

        <footer>

            <span>AROHA</span>

            <p>
                Your personal wellness space
            </p>

        </footer>

    </main>


    <script src="script.js"></script>

    <footer>
    <span>AROHA</span>
    <p>Your personal wellness space</p>

    <p class="creator-credit">
        Created by @ATR
    </p>
</footer>

</body>

</html>
